name: Frontend CI

on:
  push:
    branches: [main, develop]
    paths: ["frontend-web/**"]
  pull_request:
    branches: [main]
    paths: ["frontend-web/**"]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend-web/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: frontend-web

      - name: Lint
        run: npm run lint
        working-directory: frontend-web

      - name: Build
        run: npm run build
        working-directory: frontend-web
        env:
          NEXT_PUBLIC_API_URL: https://api.leanlife.app/v1
